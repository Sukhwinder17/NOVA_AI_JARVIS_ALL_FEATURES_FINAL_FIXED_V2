name: NOVA WA tests

on:
  push:
    branches:
      - feature/nova-wa-official
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NOVA_AI_JARVIS_ALL_FEATURES_FINAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependency
        run: python -m pip install requests
      - name: Run NOVA WA unit tests
        run: python -m unittest discover -s tests -p "test_waha_client.py"
      - name: Run WhatsApp importer tests
        run: python -m unittest discover -s tests -p "test_whatsapp_wa_importer.py"
