services:
  wppconnect:
    image: wppconnect/wppconnect-server:latest
    container_name: nova-wppconnect
    restart: unless-stopped
    ports:
      - "127.0.0.1:21465:21465"
    environment:
      SECRET_KEY: ${WPP_SECRET_KEY}
      PORT: 21465
      SERVER_PORT: 21465
    volumes:
      - nova_wpp_tokens:/usr/src/wpp-server/tokens
      - nova_wpp_user_data:/usr/src/wpp-server/userDataDir

volumes:
  nova_wpp_tokens:
  nova_wpp_user_data:
